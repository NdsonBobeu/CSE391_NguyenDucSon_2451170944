<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang web ShopTLU</title>
</head>
<body>
  <h1>Welcome to ShopTLU</h1>
  <header>
    <nav>
      <a href="/">Trang chủ</a>
      <a href="/products">Sản phẩm</a>
    </nav>
  </header>

  <main>
    <section>
      <h3>Sản phẩm hot</h3>
      <img src="iphone.jpg" alt="iPhone 16 Pro Max">
      <p>iPhone 16 Pro Max</p>
      <p>Giá: <b>25.990.000đ</b></p>
    </section>
    <section>
      <h3>Thông tin</h3>
      <table>
        <thead>
          <tr>
            <th scope="col">Tên sản phẩm</th>
            <th scope="col">Giá</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>iPhone</td>
            <td>25tr</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <aside>
    <p>Sidebar content — Sản phẩm liên quan</p>
  </aside>
  <footer>
    <p>Copyright &copy; 2026 ShopTLU</p>
  </footer>
</body>
</html>

<!--
  Các lỗi đã phát hiện và sửa (11 lỗi)

Lỗi 1: Dòng 1 — <!DOCTYPE> thiếu "html"
  Lỗi: <!DOCTYPE>
  Sửa: <!DOCTYPE html>

Lỗi 2: Dòng 5 — charset="utf8" sai format
  Lỗi: <meta charset="utf8">
  Sửa: <meta charset="UTF-8">

Lỗi 3: Dòng 4 — Thẻ <title> không đóng
  Lỗi: <title>Trang web  (thiếu </title>)
  Sửa: <title>Trang web ShopTLU</title>

Lỗi 4: Dòng 8 — Thẻ <h1> đóng sai (thiếu dấu /)
  Lỗi: <h1>Welcome to ShopTLU<h1>
  Sửa: <h1>Welcome to ShopTLU</h1>

Lỗi 5: Dòng 12 — Thẻ <a> đóng sai (thiếu dấu /)
  Lỗi: <a href="home">Trang chủ<a>
  Sửa: <a href="/">Trang chủ</a>

Lỗi 6: Dòng 12 — href="home" thiếu dấu /
  Lỗi: href="home"
  Sửa: href="/"

Lỗi 7a: Dòng 20 — Thuộc tính src thiếu dấu nháy kép
  Lỗi: <img src=iphone.jpg>
  Sửa: <img src="iphone.jpg" alt="...">

Lỗi 7b: Dòng 20 — Thiếu thuộc tính alt cho img
  Lỗi: <img src=iphone.jpg> (không có alt)
  Sửa: Thêm alt="iPhone 16 Pro Max"

Lỗi 8: Dòng 22 — Thẻ lồng nhau sai thứ tự
  Lỗi: <p>Giá: <b>25.990.000đ</p></b>
  Sửa: <p>Giá: <b>25.990.000đ</b></p>

Lỗi 9: Dòng 27-30 — Thiếu <thead> và dùng <td> thay vì <th> cho header
  Lỗi: <tr><td>Tên</td><td>Giá</td></tr> không có <thead>
  Sửa: Bọc trong <thead>, đổi <td> thành <th scope="col">

Lỗi 10: Dòng 45 — Dùng <main> lần thứ 2 cho sidebar
  Lỗi: <main><p>Sidebar content</p></main>
  Sửa: <aside><p>Sidebar content</p></aside>

Lỗi 11: Dòng 50 — Thẻ <p> trong footer không đóng
  Lỗi: <p>Copyright 2026 (thiếu </p>)
  Sửa: <p>Copyright &copy; 2026 ShopTLU</p>
-->
